name: Build Windows app
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python tools/check-startup.py
      - run: python tools/check.py
      - run: python -m PyInstaller --noconfirm --clean app.spec
      - run: python tools/verify-packaging.py . "dist/Prism Skin Studio.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Prism-Skin-Studio-Windows
          path: dist/*.exe
